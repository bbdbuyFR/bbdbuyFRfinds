<!DOCTYPE html>
<html lang="fr" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BBDBUY FR FINDS</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <script>
        tailwind.config = { 
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: { sans: ['Inter', 'sans-serif'] }
                }
            }
        }
    </script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        .modal { display: none; }
        .modal.active { display: flex; }
        select {
            background-repeat: no-repeat; 
            background-position: right 10px center;
            -webkit-appearance: none; 
            appearance: none;
        }
        .price-badge {
            background-color: #10b981;
            color: #ffffff;
            font-weight: 700;
            padding: 2px 6px;
            border-radius: 4px;
            font-size: 11px;
            line-height: 1.2;
        }
        .views-badge {
            background-color: rgba(0, 0, 0, 0.7);
            color: #e2e8f0;
            font-weight: 600;
            padding: 2px 6px;
            border-radius: 4px;
            font-size: 10px;
            backdrop-filter: blur(4px);
        }
        .tag-pill {
            background-color: #1e293b;
            color: #38bdf8;
            font-size: 10px;
            font-weight: 700;
            padding: 2px 6px;
            border-radius: 4px;
            text-transform: uppercase;
        }
        .tag-staff {
            background-color: #312e81;
            color: #a5b4fc;
            font-size: 10px;
            font-weight: 700;
            padding: 2px 6px;
            border-radius: 4px;
            text-transform: uppercase;
        }
    </style>
</head>
<body class="font-sans antialiased bg-[#121212] text-gray-200 min-h-screen">

    <!-- En-tête -->
    <header class="bg-[#181818] p-4 flex flex-col md:flex-row justify-between items-center border-b border-[#262626] sticky top-0 z-40 gap-4">
        <div class="flex flex-col sm:flex-row items-center gap-4 w-full md:w-auto">
            <div class="text-center sm:text-left">
                <span class="text-xl font-extrabold tracking-tight text-white block uppercase">BbdBuy FR Finds</span>
                <span class="text-[10px] text-emerald-400 font-bold tracking-widest uppercase">Select Premium Links</span>
            </div>
            
            <div class="flex items-center space-x-3">
                <a href="https://discord.gg/sFbvd6J6Kr" target="_blank" class="w-9 h-9 bg-[#5865F2] rounded-lg flex items-center justify-center text-white text-lg hover:opacity-90 transition-all" title="Discord">
                    <i class="fa-brands fa-discord"></i>
                </a>
                <a href="#" target="_blank" class="w-9 h-9 bg-black rounded-lg flex items-center justify-center text-white text-lg border border-gray-800 hover:opacity-90 transition-all" title="TikTok">
                    <i class="fa-brands fa-tiktok"></i>
                </a>
                <a href="https://www.bbdbuyeu.com/register?inviteCode=QLjYvT" target="_blank" class="w-9 h-9 bg-[#ff9900] rounded-lg flex flex-col items-center justify-center text-black font-extrabold text-[8px] leading-tight hover:opacity-90 transition-all" title="S'inscrire">
                    <span>BBD</span><span class="bg-black text-[#ff9900] px-0.5 rounded-[2px]">BUY</span>
                </a>
            </div>
        </div>

        <!-- Filtres et Recherche -->
        <div class="flex flex-wrap items-center gap-2 w-full md:w-auto justify-center md:justify-end">
            <input type="text" id="search" placeholder="Rechercher..." class="bg-[#222222] text-white text-xs border border-[#333333] rounded-lg px-3 py-2 w-full sm:w-44 focus:ring-1 focus:ring-emerald-500 outline-none placeholder-gray-500">
            
            <select id="filter-sort" class="bg-[#222222] text-emerald-400 font-bold text-xs border border-[#333333] rounded-lg px-3 py-2 outline-none">
                <option value="defaut">Ordre par défaut</option>
                <option value="plus-vus">🔥 Plus vus</option>
            </select>

            <select id="filter-staff" class="bg-[#222222] text-gray-300 text-xs border border-[#333333] rounded-lg px-3 py-2 outline-none">
                <option value="tous">Tous les articles</option>
                <option value="staff">Acheté par le Staff</option>
            </select>

            <select id="filter-vendeur" class="bg-[#222222] text-gray-300 text-xs border border-[#333333] rounded-lg px-3 py-2 outline-none">
                <option value="tous">Vendeurs</option>
                <option value="ccoo">CCOO</option>
                <option value="jhy">JHY</option>
                <option value="xinstore">Xinstore</option>
                <option value="pjs">PJS</option>
                <option value="mr k">Mr K</option>
            </select>

            <select id="filter-categorie" class="bg-[#222222] text-gray-300 text-xs border border-[#333333] rounded-lg px-3 py-2 outline-none">
                <option value="toutes">Catégories</option>
                <option value="PULL">PULL</option>
                <option value="BAS">BAS</option>
                <option value="SHORT">SHORT</option>
                <option value="VESTE">VESTE</option>
                <option value="CHAUSSURES">CHAUSSURES</option>
                <option value="ACCESSOIRES">ACCESSOIRES</option>
                <option value="T-SHIRT">T-SHIRT</option>
                <option value="DOUDOUNE">DOUDOUNE</option>
            </select>
        </div>
    </header>

    <!-- Zone Principale -->
    <main class="max-w-[1400px] mx-auto p-4 md:p-6">
        <div id="content-area" class="space-y-10"></div>
    </main>

    <!-- Modal Produit -->
    <div id="product-modal" class="modal fixed inset-0 bg-black/80 backdrop-blur-sm items-center justify-center z-50 p-4">
        <div class="bg-[#1e1e1e] p-6 rounded-2xl max-w-lg w-full text-center relative border border-[#333333] shadow-2xl max-h-[90vh] overflow-y-auto">
            <h3 id="modal-title" class="text-xl font-bold text-white mb-1"></h3>
            <p id="modal-meta" class="text-[11px] text-gray-400 font-semibold mb-4 uppercase tracking-wider"></p>
            
            <!-- Image complète du produit -->
            <div class="w-full bg-[#121212] rounded-xl overflow-hidden mb-5 border border-[#2a2a2a] max-h-[350px] flex items-center justify-center">
                <img id="modal-img" src="" alt="Image produit" class="w-full h-full max-h-[350px] object-contain">
            </div>

            <div id="modal-staff-box" class="hidden mb-5 p-4 bg-indigo-950/40 border-l-4 border-indigo-500 rounded-r-lg text-left flex gap-3">
                <div class="bg-[#5865F2] w-8 h-8 rounded-full flex items-center justify-center text-white shrink-0">
                    <i class="fa-brands fa-discord text-sm"></i>
                </div>
                <div class="space-y-1">
                    <h4 class="text-xs font-bold text-indigo-400 uppercase">Article vérifié par le Staff</h4>
                    <p class="text-[11px] text-gray-300 leading-snug">
                        Rejoignez notre Discord et mentionnez l'équipe pour obtenir des photos réelles de cet article.
                    </p>
                </div>
            </div>

            <div class="grid grid-cols-2 gap-3">
                <a id="modal-btn-agent" href="#" target="_blank" class="bg-emerald-600 text-white font-bold text-xs py-3 rounded-xl hover:bg-emerald-500 transition-all flex items-center justify-center">Lien Agent BBD</a>
                <a id="modal-btn-source" href="#" target="_blank" class="bg-[#2a2a2a] text-gray-200 font-bold text-xs py-3 rounded-xl border border-[#3e3e3e] hover:bg-[#333333] transition-all flex items-center justify-center">Lien Source</a>
            </div>
            
            <button onclick="closeProductModal()" class="mt-6 text-xs text-gray-400 hover:text-white font-bold uppercase tracking-widest transition-colors inline-block select-none">Fermer</button>
        </div>
    </div>

    <script>
        let tousLesProduits = [];

        // Gestion des clics en LocalStorage
        function getClicksMap() {
            return JSON.parse(localStorage.getItem('bbdbuy_product_clicks') || '{}');
        }

        function getClicks(idOuNom) {
            const map = getClicksMap();
            return map[idOuNom] || 0;
        }

        function incrementClick(idOuNom) {
            const map = getClicksMap();
            map[idOuNom] = (map[idOuNom] || 0) + 1;
            localStorage.setItem('bbdbuy_product_clicks', JSON.stringify(map));
        }

        fetch('produits.json')
            .then(res => res.json())
            .then(data => { 
                tousLesProduits = data.filter(p => p.categorie && p.categorie.trim() !== ""); 
                updateGrid(); 
            })
            .catch(err => console.error(err));

        function updateGrid() {
            const search = document.getElementById('search').value.toLowerCase();
            const staff = document.getElementById('filter-staff').value;
            const vendor = document.getElementById('filter-vendeur').value.toLowerCase();
            const cat = document.getElementById('filter-categorie').value.toUpperCase();
            const sort = document.getElementById('filter-sort').value;

            let filtered = tousLesProduits.filter(p => {
                const itemCat = p.categorie.trim().toUpperCase();
                const matchSearch = p.nom.toLowerCase().includes(search);
                const matchStaff = (staff === 'tous') || (p.acheteParStaff === true);
                const matchVendor = (vendor === 'tous') || (p.vendeur.toLowerCase() === vendor);
                const matchCat = (cat === 'TOUTES') || (itemCat === cat);
                return matchSearch && matchStaff && matchVendor && matchCat;
            });

            if (sort === 'plus-vus') {
                filtered.sort((a, b) => getClicks(b.nom) - getClicks(a.nom));
            }

            renderGrid(filtered);
        }

        function renderGrid(produits) {
            const area = document.getElementById('content-area');
            area.innerHTML = '';
            const groups = {};
            
            produits.forEach(p => { 
                const catEnMajuscules = p.categorie.trim().toUpperCase();
                if(!groups[catEnMajuscules]) groups[catEnMajuscules] = []; 
                groups[catEnMajuscules].push(p); 
            });

            for (const name in groups) {
                const section = document.createElement('section');
                section.innerHTML = `<h2 class="text-xs font-extrabold mb-3 text-emerald-400 uppercase tracking-widest">${name}</h2>`;
                
                const grid = document.createElement('div');
                grid.className = "grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-6 xl:grid-cols-7 gap-3";

                groups[name].forEach(p => {
                    const card = document.createElement('div');
                    card.className = "bg-[#1c1c1c] rounded-xl overflow-hidden border border-[#282828] cursor-pointer hover:border-[#444444] transition-all flex flex-col group h-full";
                    
                    const views = getClicks(p.nom);

                    card.onclick = () => {
                        incrementClick(p.nom);
                        openModal(p);
                        updateGrid();
                    };
                    
                    card.innerHTML = `
                        <div class="relative aspect-[4/3] w-full bg-[#1c1c1c] overflow-hidden shrink-0">
                            <span class="absolute top-2 left-2 price-badge z-10 shadow-md">${p.prix}</span>
                            <span class="absolute top-2 right-2 views-badge z-10 shadow-md flex items-center gap-1">
                                <i class="fa-regular fa-eye text-[10px]"></i> ${views}
                            </span>
                            <img src="${p.image}" class="w-full h-full object-cover group-hover:scale-105 transition-transform duration-300" loading="lazy" alt="${p.nom}">
                        </div>
                        <div class="p-2.5 flex-1 flex flex-col justify-between bg-[#1c1c1c]">
                            <h4 class="font-semibold text-xs text-gray-100 leading-tight line-clamp-2 mb-2 group-hover:text-emerald-400 transition-colors">${p.nom}</h4>
                            <div class="flex flex-wrap gap-1 mt-auto">
                                <span class="tag-pill">${p.categorie.trim().toUpperCase()}</span>
                                ${p.vendeur ? `<span class="tag-pill">${p.vendeur}</span>` : ''}
                                ${p.acheteParStaff ? `<span class="tag-staff">Staff</span>` : ''}
                            </div>
                        </div>
                    `;
                    grid.appendChild(card);
                });
                section.appendChild(grid); 
                area.appendChild(section);
            }
        }

        function openModal(p) {
            const views = getClicks(p.nom);
            
            // Récupère uniquement la valeur définie dans la propriété "tempsWH" de votre fichier produits.json
            // Si la valeur est absente ou vide, on utilise "3-5J" par défaut
            const tempsWH = (p.tempsWH && String(p.tempsWH).trim() !== "") ? String(p.tempsWH).trim().toUpperCase() : "3-5J";
            const vendeurStr = (p.vendeur && p.vendeur.trim() !== "") ? p.vendeur : "N/A";
            
            document.getElementById('modal-title').innerText = p.nom;
            document.getElementById('modal-meta').innerText = `${p.categorie.trim().toUpperCase()} • VENDEUR: ${vendeurStr} • ⏱️ WH: ${tempsWH} • 👁️ ${views} VUE${views > 1 ? 'S' : ''}`;
            document.getElementById('modal-img').src = p.image;
            document.getElementById('modal-img').alt = p.nom;
            document.getElementById('modal-btn-agent').href = p.lienAgent;
            document.getElementById('modal-btn-source').href = p.lienSource;
            
            const staffBox = document.getElementById('modal-staff-box');
            if (p.acheteParStaff) staffBox.classList.remove('hidden'); else staffBox.classList.add('hidden');
            document.getElementById('product-modal').classList.add('active');
        }

        function closeProductModal() { 
            document.getElementById('product-modal').classList.remove('active'); 
        }

        document.getElementById('search').addEventListener('input', updateGrid);
        document.getElementById('filter-sort').addEventListener('change', updateGrid);
        document.getElementById('filter-staff').addEventListener('change', updateGrid);
        document.getElementById('filter-vendeur').addEventListener('change', updateGrid);
        document.getElementById('filter-categorie').addEventListener('change', updateGrid);
    </script>
</body>
</html>
